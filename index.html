<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OAuth 2.0 — Authorization Code Flow (Interactive)</title>
<style>
:root {
  --bg: #f7f8fb;
  --paper: #ffffff;
  --ink: #0a1530;
  --ink-2: #4a5670;
  --muted: #8896ad;
  --line: #dde2ec;
  --rust: #c2410c;
  --rust-soft: #fde6d8;
  --green: #15803d;
  --code-bg: #0a1530;
  --code-text: #e6e9f0;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.4;
  height: 100svh;
  overflow: hidden;
  padding: 10px 22px;
  -webkit-font-smoothing: antialiased;
}

.container {
  max-width: 1680px;
  margin: 0 auto;
  height: 100%;
  display: flex;
  flex-direction: column;
}

/* ---------- Header ---------- */
.eyebrow {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: var(--rust);
  text-transform: uppercase;
  margin-bottom: 3px;
  line-height: 1;
}
.headline {
  font-size: 29px;
  font-weight: 800;
  letter-spacing: -0.015em;
  margin-bottom: 0;
  line-height: 1.12;
}
.subline {
  font-size: 15px;
  color: var(--ink-2);
  max-width: 760px;
}

/* ---------- Step strip ---------- */
.strip {
  display: flex;
  gap: 4px;
  margin: 8px 0 8px;
  flex: 0 0 auto;
}
.strip-item {
  flex: 1;
  height: 4px;
  background: var(--line);
  border-radius: 3px;
  cursor: pointer;
  transition: background 0.2s, transform 0.15s;
  border: none;
  padding: 0;
}
.strip-item.done { background: var(--ink); }
.strip-item.current { background: var(--rust); }
.strip-item:hover { transform: scaleY(1.4); }

/* ---------- Main layout ---------- */
.main {
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 16px;
  margin-top: 0;
  align-items: stretch;
  flex: 1 1 auto;
  min-height: 0;
}

.stage {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 22px 12px;
  overflow: hidden;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.stage-header {
  display: flex;
  align-items: baseline;
  gap: 14px;
  margin-bottom: 2px;
  flex-wrap: wrap;
}
.step-num {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 13px;
  font-weight: 700;
  color: var(--rust);
  letter-spacing: 0.05em;
}
.step-title {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.actor-trail {
  font-family: ui-monospace, monospace;
  font-size: 11.5px;
  color: var(--muted);
  margin-bottom: 12px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.actor-trail .arrow { margin: 0 7px; opacity: 0.5; }
.actor-trail .active { color: var(--ink); font-weight: 700; }

/* ---------- Mock surfaces ---------- */
.mock { margin: 0; }

/* Browser chrome */
.browser {
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  background: var(--paper);
  box-shadow: 0 1px 3px rgba(10,21,48,0.04);
}
.browser-chrome {
  background: #edf0f6;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--line);
}
.dots { display: flex; gap: 5px; }
.dot { width: 11px; height: 11px; border-radius: 50%; background: #cad0dc; }
.url-bar {
  flex: 1;
  background: white;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 5px 10px;
  font-family: ui-monospace, monospace;
  font-size: 12px;
  color: var(--ink-2);
  display: flex;
  align-items: center;
  gap: 6px;
  overflow: hidden;
}
.lock { color: var(--green); flex-shrink: 0; font-size: 10px; }
.url-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.url-host { color: var(--ink); font-weight: 600; }
.url-pk { color: var(--rust); font-weight: 600; }
.url-pv { color: var(--ink-2); }
.browser-body {
  padding: 12px 22px 12px;
  background: white;
}

/* Console chrome */
.console {
  background: var(--code-bg);
  color: var(--code-text);
  border-radius: 10px;
  overflow: hidden;
  font-family: ui-monospace, monospace;
  font-size: 12.5px;
  line-height: 1.5;
}
.console-bar {
  background: rgba(255,255,255,0.04);
  padding: 6px 16px;
  font-size: 11px;
  color: var(--muted);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  letter-spacing: 0.04em;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.console-body {
  padding: 12px 16px;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 13px;
}

/* Code highlighting tokens */
.k  { color: #fbbf24; }
.s  { color: #86efac; }
.c  { color: #94a3b8; font-style: italic; }
.n  { color: #c4b5fd; }
.m  { color: #f9a8d4; font-weight: 600; }
.cb { color: #67e8f9; }
.ok { color: #4ade80; font-weight: 700; }
.dim{ color: #64748b; }

/* Param breakdown table */
.params {
  margin: 18px 0 4px;
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  background: white;
}
.param-row {
  display: grid;
  grid-template-columns: 160px 1.3fr 1.4fr;
  padding: 7px 16px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  align-items: baseline;
  gap: 14px;
}
.param-row:last-child { border-bottom: none; }
.param-row.hi { background: var(--rust-soft); }
.param-row.hi .pkey { color: var(--rust); }
.pkey {
  font-family: ui-monospace, monospace;
  font-weight: 700;
  color: var(--ink);
  font-size: 12.5px;
}
.pval {
  font-family: ui-monospace, monospace;
  color: var(--ink-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12.5px;
}
.pnote {
  color: var(--ink-2);
  font-size: 12.5px;
  line-height: 1.45;
}

/* JWT triptych */
.jwt-tri {
  display: grid;
  grid-template-columns: 1fr 1.7fr 1.1fr;
  gap: 6px;
  margin-top: 6px;
  font-family: ui-monospace, monospace;
  font-size: 11px;
}
.jwt-seg {
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid;
  white-space: pre-wrap;
  line-height: 1.35;
}
.jwt-seg.h-seg { border-color: #d8b4fe; background: #faf5ff; color: #6b21a8; }
.jwt-seg.p-seg { border-color: #fcd34d; background: #fffbeb; color: #92400e; }
.jwt-seg.s-seg { border-color: #fca5a5; background: #fef2f2; color: #991b1b; }
.jwt-label {
  font-size: 9.5px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 4px;
  font-weight: 800;
  font-family: system-ui;
}

/* Login-form mock */
.lf {
  max-width: 360px;
  margin: 0 auto;
  padding: 0;
}
.lf h2 { font-size: 24px; margin-bottom: 14px; font-weight: 700; }
.lf .field {
  background: #f4f5f9;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 9px 13px;
  margin-bottom: 8px;
  font-size: 13px;
  color: var(--muted);
}
.lf .lf-primary {
  background: var(--ink);
  color: white;
  padding: 11px;
  border-radius: 6px;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
}
.lf .lf-divider {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--muted);
  font-size: 11px;
  margin: 12px 0;
  letter-spacing: 0.08em;
}
.lf .lf-divider::before, .lf .lf-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--line);
}
.lf .oauth-btn {
  background: white;
  border: 1.5px solid var(--ink);
  padding: 11px;
  border-radius: 6px;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  position: relative;
}
.oauth-btn.spotlight::before {
  content: '';
  position: absolute;
  inset: -5px;
  border: 2px solid var(--rust);
  border-radius: 10px;
  animation: pulse 1.8s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.4; transform: scale(1); }
  50%      { opacity: 0.9; transform: scale(1.015); }
}
.g-mark {
  font-weight: 800;
  font-size: 17px;
  background: linear-gradient(135deg, #4285F4 0%, #34A853 33%, #FBBC05 66%, #EA4335 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* Provider consent */
.consent-card {
  max-width: 460px;
  margin: 0 auto;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px 20px;
  background: white;
}
.consent-app {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
}
.consent-logo {
  width: 38px;
  height: 38px;
  background: linear-gradient(135deg, #9d174d, #c2410c);
  color: white;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 16px;
}
.consent-title { font-weight: 700; font-size: 14px; line-height: 1.4; }
.consent-sub   { color: var(--muted); font-size: 13px; margin-top: 2px; }
.consent-intro { font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }
.consent-perm {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 4px 0;
  font-size: 13px;
}
.consent-perm .ck { color: var(--green); flex-shrink: 0; font-weight: 700; }
.consent-foot {
  font-size: 12px;
  color: var(--muted);
  margin-top: 8px;
  line-height: 1.45;
}
.consent-buttons {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}
.consent-buttons > div {
  flex: 1;
  padding: 10px;
  border-radius: 6px;
  text-align: center;
  font-size: 13.5px;
  font-weight: 600;
}
.c-cancel { background: white; border: 1px solid var(--line); color: var(--ink-2); }
.c-allow  { background: var(--ink); color: white; }

/* Provider sign-in */
.g-signin {
  max-width: 340px;
  margin: 0 auto;
  background: white;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 22px 24px;
}
.g-logo {
  text-align: center;
  font-size: 26px;
  font-weight: 500;
  margin-bottom: 12px;
}
.g-h { text-align: center; font-size: 22px; font-weight: 400; margin-bottom: 6px; }
.g-s { text-align: center; font-size: 13px; color: var(--ink-2); margin-bottom: 14px; }
.g-input {
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 12px;
  font-size: 13px;
  color: var(--muted);
}
.g-link { color: #1a73e8; font-size: 13px; margin-top: 10px; cursor: pointer; }
.g-note { font-size: 12px; color: var(--ink-2); margin-top: 14px; line-height: 1.45; }
.g-row  {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 14px;
}
.g-create { color: #1a73e8; font-size: 13px; font-weight: 500; }
.g-next   { background: #1a73e8; color: white; padding: 8px 22px; border-radius: 4px; font-size: 13px; font-weight: 500; }

/* Dashboard mock */
.dash-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 24px;
}
.dash-brand { font-weight: 700; font-size: 16px; }
.dash-user  { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.dash-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, #9d174d, #c2410c);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13px;
}
.dash-h { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
.dash-p { font-size: 15px; color: var(--ink-2); }
.cookie-box {
  margin-top: 22px;
  padding: 14px 16px;
  background: #f4f5f9;
  border-radius: 8px;
  font-family: ui-monospace, monospace;
  font-size: 12px;
  color: var(--ink-2);
  border-left: 3px solid var(--ink);
}
.cookie-box b { color: var(--ink); display: block; margin-bottom: 4px; font-family: system-ui; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }

/* Dev console mock */
.devc {
  font-size: 13px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.devc-bar {
  background: #edf0f6;
  padding: 9px 14px;
  border-bottom: 1px solid var(--line);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
}
.devc-body { padding: 16px 20px; }
.devc-title { font-size: 20px; font-weight: 700; margin-bottom: 14px; }
.devc-grid {
  display: grid;
  grid-template-columns: 150px 1fr;
  gap: 12px;
  font-size: 13px;
  align-items: center;
}
.devc-label { color: var(--muted); }
.devc-val {
  font-family: ui-monospace, monospace;
  font-size: 12px;
  background: #f4f5f9;
  padding: 7px 10px;
  border-radius: 5px;
  word-break: break-all;
}
.devc-val.secret {
  background: #fee2e2;
  color: #991b1b;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.tag-server {
  font-size: 9.5px;
  letter-spacing: 0.08em;
  background: #991b1b;
  color: white;
  padding: 2px 7px;
  border-radius: 3px;
  font-weight: 700;
  font-family: system-ui;
  flex-shrink: 0;
}

/* Redirect spinner */
.redir {
  text-align: center;
  padding: 26px 20px;
  color: var(--muted);
}
.redir .arc {
  font-size: 36px;
  display: inline-block;
  animation: spin 1.2s linear infinite;
  margin-bottom: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Pillars sidebar ---------- */
.pillars {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 18px 10px;
  overflow-y: auto;
  scrollbar-width: thin;
  min-height: 0;
}
.pillars h3 {
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}
.pillar {
  padding: 5px 0;
  border-top: 1px solid var(--line);
  transition: all 0.25s ease;
}
.pillar:first-of-type { border-top: none; padding-top: 2px; }
.pillar-name {
  font-family: ui-monospace, monospace;
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 2px;
}
.pillar-tag {
  font-family: system-ui;
  font-size: 9px;
  letter-spacing: 0.08em;
  padding: 2px 6px;
  border-radius: 3px;
  font-weight: 700;
  background: #e2e8f0;
  color: var(--ink-2);
  text-transform: uppercase;
  white-space: nowrap;
}
.pillar-tag.public { background: #dbeafe; color: #1e40af; }
.pillar-tag.secret { background: #fee2e2; color: #991b1b; }
.pillar-tag.locked { background: #e9d5ff; color: #6b21a8; }
.pillar-tag.jwt    { background: #fef3c7; color: #92400e; }
.pillar-desc {
  font-size: 13px;
  color: var(--ink-2);
  line-height: 1.4;
}
.pillar.active {
  margin: 3px -8px;
  padding: 7px 10px;
  background: var(--rust-soft);
  border-radius: 8px;
  border-top: none;
}
.pillar.active + .pillar { border-top: none; }
.pillar.active .pillar-name { color: var(--rust); }
.pillar.active .pillar-desc { color: #7c2d12; }

/* ---------- Explanation panel ---------- */
.explain {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 10px;
  flex: 0 0 auto;
}
.exp-card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 18px;
}
.exp-card.why {
  border-left: 4px solid var(--rust);
}
.exp-label {
  font-size: 10.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 800;
  margin-bottom: 6px;
}
.exp-label.what { color: var(--ink-2); }
.exp-label.why  { color: var(--rust); }
.exp-text { font-size: 15.5px; line-height: 1.5; color: var(--ink); }
.exp-text code {
  background: #f4f5f9;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 13.5px;
  font-family: ui-monospace, monospace;
  color: var(--ink);
}
.exp-text em { font-style: italic; }
.exp-text strong { font-weight: 700; }

/* ---------- Controls ---------- */
.controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 8px;
  flex: 0 0 auto;
}
.btn {
  background: var(--ink);
  color: white;
  border: none;
  padding: 10px 24px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: transform 0.12s, opacity 0.15s;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.ghost {
  background: white;
  color: var(--ink);
  border: 1px solid var(--line);
}
.step-readout {
  font-family: ui-monospace, monospace;
  font-size: 12.5px;
  color: var(--muted);
}
.kbd-hint {
  margin-top: 14px;
  text-align: center;
  font-size: 11.5px;
  color: var(--muted);
}
.kbd {
  background: white;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 1px 6px;
  font-family: ui-monospace, monospace;
  font-size: 10.5px;
  margin: 0 2px;
}

/* Footer note */
.footnote {
  margin-top: 36px;
  padding: 16px 18px;
  background: var(--paper);
  border: 1px dashed var(--line);
  border-radius: 10px;
  font-size: 12.5px;
  color: var(--ink-2);
  line-height: 1.6;
}
.footnote strong { color: var(--ink); }

/* Fade-in on step change */
.fade-enter { animation: fadeIn 0.32s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}


/* Viewport-fit: stage body flexes; mock scales to available height */
#stageBody {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding-top: 4px;
}
#stageBody .mock {
  flex: 0 0 auto;
  transform-origin: top center;
  will-change: transform;
}
#stageBody .mock-fit {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: stretch;
}
#stageBody .browser,
#stageBody .console {
  max-height: 100%;
}
/* Let inner scrollable code areas shrink rather than clip when extremely short */
/* mock scales as a whole; no inner scroll needed */

/* Responsive */
@media (max-width: 900px) {
  .main, .explain { grid-template-columns: 1fr; }
  .pillars { position: static; }
  .headline { font-size: 26px; }
  .stage { padding: 22px; }
}

/* ---------- Personalised header ---------- */
.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  flex: 0 0 auto;
}
.header-row .head-left { flex: 1; min-width: 0; }
.brand-logos {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 0;
  padding: 7px 18px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 1px 3px rgba(10,21,48,0.04);
}
.brand-logos img {
  height: 88px;
  width: auto;
  display: block;
}

let current = 0;
const stageBody = document.getElementById('stageBody');

function actorTrail(active) {
  const actors = ['User','Browser','App Server','Provider'];
  return actors.map(a => {
    const cls = active.includes(a) ? 'active' : '';
    return `<span class="${cls}">${a}</span>`;
  }).join('<span class="arrow">›</span>');
}

function renderPillars(activeIds) {
  const panel = document.getElementById('pillars');
  panel.innerHTML =
    '<h3>Security Pillars</h3>' +
    PILLARS.map(p => {
      const active = activeIds.includes(p.id) ? ' active' : '';
      return `<div class="pillar${active}">
        <div class="pillar-name">${p.name}<span class="pillar-tag ${p.tagClass}">${p.tag}</span></div>
        <div class="pillar-desc">${p.desc}</div>
      </div>`;
    }).join('');
  // Scroll first active pillar into view inside the panel (no page scroll)
  const firstActive = panel.querySelector('.pillar.active');
  if (firstActive) {
    panel.scrollTop = Math.max(0, firstActive.offsetTop - panel.offsetTop - 36);
  } else {
    panel.scrollTop = 0;
  }
}

function renderStrip() {
  document.getElementById('strip').innerHTML = STEPS.map((s,i) => {
    const cls = i < current ? 'done' : (i === current ? 'current' : '');
    return `<button class="strip-item ${cls}" data-i="${i}" aria-label="Step ${i+1}: ${s.title}" title="${i+1}. ${s.title}"></button>`;
  }).join('');
}

function render() {
  const step = STEPS[current];
  const n = (i) => String(i+1).padStart(2,'0');
  document.getElementById('stepNum').textContent = `${n(current)} / ${n(STEPS.length-1)}`;
  document.getElementById('stepTitle').textContent = step.title;
  document.getElementById('actorTrail').innerHTML = actorTrail(step.actors);
  document.getElementById('expWhat').innerHTML = step.what;
  document.getElementById('expWhy').innerHTML  = step.why;

  // Stage body with fade animation
  stageBody.classList.remove('fade-enter');
  stageBody.innerHTML = step.screen;
  void stageBody.offsetWidth;
  stageBody.classList.add('fade-enter');

  renderPillars(step.pillars);
  renderStrip();

  document.getElementById('readout').textContent = `step ${current+1} of ${STEPS.length}`;
  document.getElementById('prev').disabled = current === 0;
  document.getElementById('next').disabled = current === STEPS.length - 1;

  fitMock();
}

// Scale the mock screen so the whole step always fits the stage with no clipping.
function fitMock() {
  const body = document.getElementById('stageBody');
  const mock = body.querySelector('.mock');
  if (!mock) return;
  mock.style.transform = 'scale(1)';
  // Measure on the next frame so layout is settled.
  requestAnimationFrame(() => {
    const avail = body.clientHeight - 4;          // minus the small top padding
    const natural = mock.getBoundingClientRect().height;
    if (natural > avail && natural > 0) {
      const scale = Math.max(0.62, avail / natural);
      mock.style.transform = `scale(${scale})`;
    } else {
      mock.style.transform = 'scale(1)';
    }
  });
}
window.addEventListener('resize', fitMock);

// ============================ EVENTS ============================
document.getElementById('prev').addEventListener('click', () => {
  if (current > 0) { current--; render(); }
});
document.getElementById('next').addEventListener('click', () => {
  if (current < STEPS.length - 1) { current++; render(); }
});
document.getElementById('strip').addEventListener('click', (e) => {
  const t = e.target.closest('.strip-item');
  if (!t) return;
  current = parseInt(t.dataset.i, 10);
  render();
});
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea, select')) return;
  if (e.key === 'ArrowLeft'  && current > 0) { current--; render(); }
  if (e.key === 'ArrowRight' && current < STEPS.length - 1) { current++; render(); }
});

render();
</script>
</body>
</html>
